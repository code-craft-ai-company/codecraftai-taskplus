name: Example Workflow A
environment:
    AKIT_BUILD_BRANCH: somebranch
    AKIT_BUILD_NAME: somebuild-2.1.456
    AKIT_JOBTYPE: unknown

parameters:
    branch: somebranch
    build: somebuild-2.1.456
    landscape: $HOME/automojo/config/default-landscape.yaml

tasklist:
    - task: Print OS Name
      tasktype: automojo.taskplus.tasks.embeddedpython@EmbeddedPython
      script:
          - import os
          - print(os.name)

    - task: List Directories
      tasktype: automojo.taskplus.tasks.shellscript@BashScript
      script:
          - ls -al

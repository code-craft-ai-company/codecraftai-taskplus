[tool.poetry]
name = "codecraftai-taskplus"
description = "Code Craft AI Task Plus Library"
version = "0.0.2"
authors = [
    "Myron Walker <myron.walker@gmail.com>"
]
readme = "README.md"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

homepage = "https://code-craft.ai"
repository = "https://github.com/code-craft-ai-company/codecraftai-taskplus"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
click = "^8.1.3"
codecraftai-errors = { git = "https://github.com/code-craft-ai-company/codecraftai-errors.git", branch = "main" }
codecraftai-runtime = { git = "https://github.com/code-craft-ai-company/codecraftai-runtime.git", branch = "main" }
codecraftai-this-app = { git = "https://github.com/code-craft-ai-company/codecraftai-this-app.git", branch = "main" }
codecraftai-xmodules = { git = "https://github.com/code-craft-ai-company/codecraftai-xmodules.git", branch = "main" }
pyyaml = "^6.0.2"

[tool.poetry.scripts]
taskplus = "ccai.taskplus.cli.taskpluscommand:taskplus_root_command"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
codecraftai-testbase = { git = "https://github.com/code-craft-ai-company/codecraftai-testbase.git", branch = "main" }
myst-parser = "^0.18.1"
sphinx = ">=1.6,<6"
sphinx-rtd-theme = "^1.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
